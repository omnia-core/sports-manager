# The job below ALWAYS runs and always reports the "Build, vet & test" context
# that branch protection requires. Path filtering happens INSIDE the job instead
# of in the `on:` trigger. See frontend.yml for the full rationale.
name: Backend CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, vet & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sports_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        working-directory: .
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
             | grep -qE '^(backend/|\.github/workflows/backend\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No files under backend/ changed — nothing to build, vet or test."
          fi

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: go build ./...

      - name: Vet
        if: steps.changes.outputs.changed == 'true'
        run: go vet ./...

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: go test ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sports_manager_test?sslmode=disable
          JWT_SECRET: test-secret-at-least-32-characters-long
