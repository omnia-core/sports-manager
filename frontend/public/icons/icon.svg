<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#020617"/>
  <!-- Basketball court lines (simplified halfcourt) -->
  <rect x="64" y="96" width="384" height="320" rx="8" fill="none" stroke="#10B981" stroke-width="10"/>
  <!-- Key -->
  <rect x="176" y="256" width="160" height="160" fill="none" stroke="#10B981" stroke-width="8"/>
  <!-- FT circle -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#10B981" stroke-width="8"/>
  <!-- Hoop -->
  <circle cx="256" cy="376" r="24" fill="none" stroke="#6EE7B7" stroke-width="8"/>
  <!-- Center dot -->
  <circle cx="256" cy="120" r="10" fill="#10B981"/>
</svg>
